{% extends "tasks/layout.html" %}

{% block body  %}
    <h1>Tasks</h1>
    
        {% for task in tasks %}
            <li>
                <strong>{{ task.name }}</strong> — Priority: {{ task.priority }}
            </li>
        {% endfor %}
    

<a href="{% url 'tasks:add' %}">Add Task</a>
    <hr>
    
    <form action="{% url 'tasks:delete_all' %}" method="post">
        {% csrf_token %}
        <button type="submit">Clear All Tasks</button>
    </form>

{% endblock %}
