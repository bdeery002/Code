name: Testing

on: [push]

jobs:
  test_project:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lecture7/airline0
        
    steps:
      - name: Checkout code
        uses: actions/checkout@v4  # Updated to v4 (latest stable)

      - name: Run Django unit tests
        run: |
          pip3 install django
          python3 manage.py test