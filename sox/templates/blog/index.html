{% extends "layout.html" %}

{% block title %}Blogs{% endblock %}

{% block body %}
    <h1>All Pages</h1>

    <ul>
        {% for entry in entries %}
            <li>
                <a href="{% url 'entry' title=entry.title %}">{{ entry.title }}</a>
            </li>
        {% endfor %}
    </ul>

    <hr>
    <a href="{% url 'propose_new' %}" class="btn-save">Propose New Entry</a>
{% endblock %}
