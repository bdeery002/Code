{% extends "sox_controls/base_sox.html" %}

{% block content %}
<h1>SOX Management Dashboard</h1>

<div class="tabs" style="display: flex; gap: 5px; margin-bottom: 0;">
    <button class="tab-btn active" 
            hx-get="{% url 'sox_controls:load_workflow' 'p2p' %}" 
            hx-target="#workflow-container"
            hx-on:click="updateActiveTab(this)">
        Procure to Pay (P2P)
    </button>
    <button class="tab-btn" 
            hx-get="{% url 'sox_controls:load_workflow' 'otc' %}" 
            hx-target="#workflow-container"
            hx-on:click="updateActiveTab(this)">
        Order to Cash (OTC)
    </button>
</div>

<section id="workflow-container" 
         hx-get="{% url 'sox_controls:load_workflow' 'p2p' %}" 
         hx-trigger="load" 
         style="background: #fff; padding: 20px; border: 1px solid #000; margin-bottom: 30px; border-top: none; min-height: 180px;">
    </section>

<section>
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2>Control List</h2>
        <button hx-get="{% url 'sox_controls:index' %}" 
                hx-target="#control-results" 
                style="cursor: pointer; padding: 5px 10px; background: #f8f9fa; border: 1px solid #000;">
            Clear All Filters
        </button>
    </div>

    <table class="table">
        <thead>
            <tr>
                <th class="col-proc">PROCESS</th>
                <th class="col-sub">SUB-PROCESS</th>
                <th class="col-desc">DESCRIPTION</th>
                <th class="col-risk">RISK</th>
            </tr>
            <tr class="filter-row">
                <th><input type="text" id="filter-proc" name="filter_proc" placeholder="Filter..." 
                           hx-get="{% url 'sox_controls:index' %}" hx-trigger="keyup changed delay:300ms" 
                           hx-target="#control-results" hx-include="nearest tr"></th>
                <th><input type="text" id="filter-sub" name="filter_sub" placeholder="Filter..." 
                           hx-get="{% url 'sox_controls:index' %}" hx-trigger="keyup changed delay:300ms" 
                           hx-target="#control-results" hx-include="nearest tr"></th>
                <th><input type="text" name="filter_desc" placeholder="Filter..." 
                           hx-get="{% url 'sox_controls:index' %}" hx-trigger="keyup changed delay:300ms" 
                           hx-target="#control-results" hx-include="nearest tr"></th>
                <th><input type="text" name="filter_risk" placeholder="Filter..." 
                           hx-get="{% url 'sox_controls:index' %}" hx-trigger="keyup changed delay:300ms" 
                           hx-target="#control-results" hx-include="nearest tr"></th>
            </tr>
        </thead>
        <tbody id="control-results">
            {% include "sox_controls/partials/control_table_rows.html" %}
        </tbody>
    </table>
</section>

<script>
    function updateActiveTab(element) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        element.classList.add('active');
    }
</script>

{% endblock %}
