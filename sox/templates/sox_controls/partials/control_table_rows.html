{% for control in controls %}
<tr>
    <td>{{ control.process.name }}</td>
    <td>{{ control.sub_process }}</td>
    <td>{{ control.control_description }}</td>
    <td>{{ control.risk }}</td>
</tr>
{% empty %}
<tr>
    <td colspan="4" style="text-align: center; padding: 20px; color: #666; font-style: italic;">
        No controls match your current filter criteria.
    </td>
</tr>
{% endfor %}
