<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Single Page</title>
        <style>
        </style>
        <script>

         //This code tells the browser: "When the user clicks 'Back,' don't reload the whole page—just look at the 
         // saved history data and show the correct section of the page immediately   
         window.onpopstate = function(event) {
                // Only try to show the section if the state actually exists
                if (event.state && event.state.section) {
                    console.log(event.state.section);
                    showSection(event.state.section);
                }
            };

            // This function takes the section number from button.onclick and makes a fetch request to the server to get the content for that section.

            function showSection(section) {
                
                fetch(`/sections/${section}`)
                .then(response => response.text())
                .then(text => {
                    console.log(text);
                    document.querySelector('#content').innerHTML = text;
                });

            }

            //this code sets up click handlers for the buttons. 
            //When a button is clicked, it sets i to the value of <button data-section-number="1">, which is the section number.
                // Then, it uses history.pushState to save the current state (the section number) and update the URL to something like /section1. 
                // Finally, it calls showSection(section) to fetch and display the content for that section. 
                // This way, when you click a button,it updates the URL and shows the corresponding section without reloading the page.
            document.addEventListener('DOMContentLoaded', function() {
                document.querySelectorAll('button').forEach(button => {
                    button.onclick = function() {
                        const i = this.dataset.section;
                        history.pushState({section: i}, "", `section${i}`);
                        showSection(i);
                    };
                });
            });
        </script>
    </head>
    <body>
        <h1>Hello!</h1>
        <button data-section="1">Section 1</button>
        <button data-section="2">Section 2</button>
        <button data-section="3">Section 3</button>
        <div id="content">
        </div>
    </body>
</html>
