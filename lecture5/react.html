<!DOCTYPE html>
<html lang="en">
    <head>
        <script src="https://unpkg.com/react@17/umd/react.production.min.js" crossorigin></script>
        <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js" crossorigin></script>
        <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
        <title>Hello</title>
    </head>
    <body>
        <!--This is where our React app will be rendered--> 
        <div id="apple"></div>

      <!--In a real app, we would put this in a separate .jsx file and compile it with a build tool like Webpack or Vite.-->
        <script type="text/babel">

            function Hello(props) {
                return <h1>Hello, {props.name}!</h1>;
            }

            function App() {
                return(
                    <div>
                        <Hello name="Alice" />
                        <Hello name="Bob" />
                        <Hello name="Charlie" />
                    </div>
                )
            }

            ReactDOM.render(<App />, document.querySelector("#apple"));
        </script>
    </body>
</html>
