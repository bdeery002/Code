<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script>
        let count = 0;
        function increment() {
            count++;
            document.getElementById("counter").innerText = count;
        }
        function decrement() {
            count--;
            document.getElementById("counter").innerText = count;
        }

        let Motherfucker = 42;
        function showMotherfucker() {
            alert(Motherfucker);
        }   
    </script>

</head>
<body>
    <h1 id="counter">0</h1>
    <button onclick="increment()">+</button>
    <button onclick="decrement()">-</button>
    <button onclick="showMotherfucker()">Show Motherfucker</button>
</body>
</html>
