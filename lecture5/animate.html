<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animatet</title>

    <style>
            h1 {
                position: relative;
                color: #333;
                animation-name: grow;
                animation-duration: 2s;
                animation-fill-mode: forwards;
                animation-iteration-count: 2;

            }

            @keyframes grow {
                0% {
                    font-size: 24px;
                    color: #333;
                }
                50% {
                    font-size: 48px;
                    color: #007BFF;
                }
                100% {
                    font-size: 36px;
                    color: #333;
                }
            } 
    </style>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const heading = document.querySelector('h1');
            heading.style.animationPlayState = 'paused';

            document.querySelector('button').addEventListener('click', () => {
                if(heading.style.animationPlayState === 'paused') {
                    heading.style.animationPlayState = 'running';
                } else {
                    heading.style.animationPlayState = 'paused';
                }
            });     
            
        });

    </script>
</head>
<body>
    <button onclick="animateText()">Click here</button>
    <h1>Welcome to the Animated Page!</h1>


</body>
</html>
