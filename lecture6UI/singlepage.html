<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS50 Single Page Application</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }
        /* Hide all divs by default */
        .page {
            display: none;        
        }
    </style>

    <script>

        // Most developers put things in this order for readability:
        // All function declarations first
        // Then DOMContentLoaded (or just attach events directly if script is at bottom)

           

        function showPage(page) {
            // 1. Hide every div
            //// This whole block runs first and must finish
            document.querySelectorAll('.page').forEach(div => {
                div.style.display = 'none';
            });

            // 2. Show the specific page requested
            // Only after step 1 is completely finished does this line run
            document.querySelector(`#${page}`).style.display = 'block';
        }

        // Attach listeners once the DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            //loop over all buttons with a data-page attribute and attach a click listener to each
            // When a button is clicked, call showPage with the value of the data-page attribute
            document.querySelectorAll('button[data-page]').forEach(btn => {
                btn.addEventListener('click', () => {
                showPage(btn.dataset.page);
             });
            });
         });

    </script>
</head>
<body>
    <!--Use data attributes to specify which page to show when a button is clicked-->
    <button data-page="page1">Show Page 1</button>
    <button data-page="page2">Show Page 2</button>
    <button data-page="page3">Show Page 3</button>

    <div id="page1" class ="page">
        <h1>This is page 1.</h1>
    </div>

    <div id="page2" class ="page">
        <h1>This is page 2.</h1>
    </div>

    <div id="page3" class ="page">
        <h1>This is page 3.</h1>
    </div>

    <div>
        <h1>Welcome to CS50!</h1>
        <p>This is a single page application.</p>
    </div>
</body>
</html>
