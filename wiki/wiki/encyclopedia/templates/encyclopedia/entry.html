{% extends "encyclopedia/layout.html" %}

{% block title %}
    {{ title }}
{% endblock %}

{% block body %}
    {# Render the converted Markdown content #}
    <div class="entry-content">
        {{ content|safe }}
    </div>

    <hr>
    <a href="{% url 'edit_entry' title %}" class="btn btn-secondary">Edit this Page</a>
{% endblock %}
