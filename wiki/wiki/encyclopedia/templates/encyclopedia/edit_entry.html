{% extends "encyclopedia/layout.html" %}

{% block title %}Edit {{ title }}{% endblock %}

{% block body %}
    <h1>Edit Entry: {{ title }}</h1>

    <form action="{% url 'edit_entry' title %}" method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="content">Markdown Content:</label>
            {# Note: Do not put spaces between the tags and {{ content }} #}
            <textarea name="content" class="form-control" rows="15">{{ content }}</textarea>
        </div>
        <button type="submit">Save Changes</button>
    </form>
{% endblock %}
