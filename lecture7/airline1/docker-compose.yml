services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: appdb
    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
          test: ["CMD-SHELL", "pg_isready -U app -d appdb"]
          interval: 5s
          timeout: 5s
          retries: 5
  web:  # Renamed from 'app' to match your error log 'web-1'
    build: .
    volumes:
      - .:/app  # Maps your current folder to /app in the container
    working_dir: /app
    ports:
      - "8081:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    command: >
      bash -c "python manage.py migrate && 
               python manage.py runserver 0.0.0.0:8000"

volumes:
  postgres_data: