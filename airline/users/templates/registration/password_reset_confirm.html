{% extends "users/layout.html" %}
{% block content %}
  <h1>Set new password</h1>
  {% if validlink %}
    {% url 
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Change password</button>
    </form>
  {% else %}
    <p>This reset link is invalid or expired.</p>
  {% endif %}
{% endblock %}
